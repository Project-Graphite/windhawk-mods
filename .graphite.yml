projects:
  - slug: windhawk-mods
    kind: epic
    name: Windhawk Mods
    summary: >
      A growing collection of native Windows customizations built for Windhawk, the open-source
      marketplace and framework for modifying programs without replacing system files.
    tags: [cpp, windows, windhawk, win32]
    owner: amr
    authors: [AmrMsCLL]
    status: source-only
    listed: true
    showcase:
      problem: >
        Useful Windows customizations are often distributed as opaque executables or broad system
        replacements, making them difficult to inspect, maintain and trust across Windows updates.
      approach: >
        Each customization is developed as a focused Windhawk mod with its own folder, documentation
        and reviewable C++ source. The collection favors native Windows behavior, explicit settings
        and resilient integration points over standalone background applications.
      outcome: >
        Project Graphite has a maintainable home for Windows experiments where every mod can be
        understood, installed and evolved independently while sharing consistent quality checks.
      contributions:
        - github: AmrMsCLL
          summary: >
            Designs and maintains the collection, its native Windows integrations, settings models,
            project documentation and validation workflow.
    deploy:
      kind: none

  - slug: stack-switch
    parent: windhawk-mods
    kind: project
    name: StackSwitch
    summary: >
      A Windhawk taskbar launcher that starts and stops configurable working sets of applications,
      folders, editor workspaces, URLs and terminal commands with one action.
    tags: [cpp, windows, windhawk, win32]
    owner: amr
    authors: [AmrMsCLL]
    status: source-only
    listed: true
    showcase:
      problem: >
        A development session can mean opening the same mix of applications, workspaces, folders,
        URLs and terminal commands, then finding and closing them all again in the right order.
      approach: >
        StackSwitch adds a native taskbar panel with persistent selections, named profiles, grouped
        items, launch delays and wait-for-exit behavior. It closes the same selection in reverse
        order and avoids fragile Windows symbol resolution by using a layered child window.
      outcome: >
        One taskbar action can start or stop a repeatable working environment while optional tools
        stay disabled until needed, and the integration remains resilient across Windows updates.
      contributions:
        - github: AmrMsCLL
          summary: >
            Designed and implemented the Win32 taskbar integration, configuration model, process
            orchestration, profiles, persisted selections and user-facing launcher panel.
    deploy:
      kind: none
